name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK
        run: ./gradlew assembleDebug
      - name: Check the channel URL comes from the Gradle property
        run: |
          ./gradlew generateDebugBuildConfig -Pkanal.configUrl=https://ci.example/channels.json -Pkanal.metaUrl=https://ci.example/meta.json
          f=$(find app/build/generated -name BuildConfig.java -path '*debug*' | head -1)
          cat "$f"
          grep -q 'CONFIG_URL = "https://ci.example/channels.json"' "$f"
          grep -q 'META_URL = "https://ci.example/meta.json"' "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: kanal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true
      - name: Build the debug APK
        run: ./gradlew assembleDebug
      - name: Check the channel URL comes from the Gradle property
        run: |
          ./gradlew generateDebugBuildConfig -Pkanal.configUrl=https://ci.example/channels.json -Pkanal.metaUrl=https://ci.example/meta.json
          f=$(find app/build/generated -name BuildConfig.java -path '*debug*' | head -1)
          cat "$f"
          grep -q 'CONFIG_URL = "https://ci.example/channels.json"' "$f"
          grep -q 'META_URL = "https://ci.example/meta.json"' "$f"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kanal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
